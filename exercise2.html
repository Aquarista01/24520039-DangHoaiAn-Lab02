
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 02 - Exercise 2 Task Manager</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 32px 16px;
      background: #eef3f0;
      color: #243b34;
      font-family: Arial, sans-serif;
      line-height: 1.5;
    }

    .task-app {
      max-width: 720px;
      margin: 0 auto;
      padding: 32px;
      background: white;
      border: 1px solid #d9e5de;
      border-radius: 16px;
      box-shadow: 0 10px 30px #203b3010;
    }

    .eyebrow {
      color: #47846a;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    h1 {
      margin: 8px 0;
      font-size: 32px;
    }

    h2 {
      font-size: 18px;
      margin: 24px 0 12px;
    }

    .summary {
      color: #63796e;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    input {
      min-width: 0;
      flex: 1;
      padding: 12px;
      border: 1px solid #b7ccc0;
      border-radius: 8px;
      font: inherit;
    }

    button {
      padding: 11px 16px;
      border: 1px solid #b7ccc0;
      border-radius: 8px;
      background: white;
      color: #245441;
      font: inherit;
      cursor: pointer;
    }

    button:hover {
      background: #eef6f1;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid #81bb99;
      outline-offset: 2px;
    }

    #add-task {
      background: #265e47;
      border-color: #265e47;
      color: white;
      font-weight: bold;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .filter.active {
      background: #265e47;
      border-color: #265e47;
      color: white;
    }

    .task-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .task-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
      padding: 12px 16px;
      border: 1px solid #d9e5de;
      border-radius: 10px;
    }

    .task-title {
      overflow-wrap: anywhere;
    }

    .completed .task-title {
      color: #71867a;
      text-decoration: line-through;
    }

    .empty-state {
      padding: 20px;
      text-align: center;
      background: #f5f8f6;
      border-radius: 8px;
      color: #71867a;
    }

    footer {
      margin-top: 30px;
      color: #71867a;
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 520px) {
      .task-app {
        padding: 20px;
      }

      .input-row {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <script type="module" src="./exercise2-main.js"></script>
</body>
</html>
